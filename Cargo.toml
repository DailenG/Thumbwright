[workspace]
resolver = "3"
members = ["crates/tw-core", "crates/tw-shell", "crates/twctl", "crates/tw-settings", "xtask"]
default-members = ["crates/tw-core", "crates/tw-shell", "crates/twctl", "crates/tw-settings"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
tw-core = { path = "crates/tw-core" }

# Known advisory exception (audit H-3): `paste` 1.0.15 (RUSTSEC-2024-0436, unmaintained, no
# vulnerability) is a compile-time proc-macro pulled in by lofty, pulp (exr, image) and rav1e
# (ravif). It cannot be dropped without replacing all three; see .cargo/audit.toml and SECURITY.md.

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
# Shell code: unwinding is required so catch_unwind can contain decoder panics (REQ-ISO-3).
panic = "unwind"
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
