[package]
name = "tw-settings"
description = "Thumbwright settings app (thumbwright-settings.exe)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "thumbwright-settings"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tw-core = { version = "0.1.0", path = "../tw-core" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
windows-registry = "0.6"
