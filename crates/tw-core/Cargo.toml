[package]
name = "tw-core"
description = "Thumbwright shared core: identity, format matrix, budgets, decode pipeline, registration"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Pure Rust (SIMD via std::arch, no build-time native code). No `rayon`, for the reason below.
fast_image_resize = "6.1.0"
djvu-rs = { version = "0.43.0", default-features = false, features = ["std"] }
# gzip for .emz/.wmz and Blender (pure-Rust backend, already in the dependency tree via zip).
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
hayro-jpeg2000 = { version = "0.4.1", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
# No `rayon`: a global thread pool would keep running this DLL's code after COM unloads it.
jxl-oxide = { version = "0.12.6", default-features = false }
lofty = "0.25.4"
memchr = { version = "2", default-features = false }
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
# HEIC/HEIF (HEVC): the author's pure-Rust reader (`forbid(unsafe_code)`). Not on crates.io, so it
# is pinned by commit; `cargo xtask licenses` takes its licence from its Cargo.toml.
open-heic = { git = "https://github.com/DailenG/open-heic", rev = "cfa6d66e3a75ecf4040f70ac0d76c0582be9504b" }
psd = "0.3.5"
resvg = "0.48.1"
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Graphics_Imaging", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Media_MediaFoundation", "Win32_System_Variant", "Win32_System_WinRT", "Win32_System_DataExchange", "Win32_Graphics_Gdi", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Data_Pdf", "Storage_Streams", "Foundation", "UI"] }
windows-core = "0.62"
windows-registry = "0.6"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
rars = { version = "0.11", default-features = false }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["deflate", "ppmd"] }

[dev-dependencies]
# Measurement harness only (examples/perf.rs): peak working set. Worker UI-limit test: desktops.
windows = { version = "0.62", features = ["Win32_System_ProcessStatus", "Win32_System_StationsAndDesktops"] }
# Test fixtures only: in-memory 7z / RAR writers.
rars = { version = "0.11", default-features = false, features = ["write", "encryption"] }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress", "deflate", "ppmd"] }
